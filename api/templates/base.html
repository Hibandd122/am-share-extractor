<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nexus Alight Extractor · Professional AM XML & Assets Tool{% endblock %}</title>
    <meta name="description" content="Extract XML project definitions, layer hierarchies, and full media packages directly from Alight Motion share links or QR codes. High performance Firebase Storage bypass.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Ambient glowing orbs background -->
    <div class="orb-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Site Header -->
    <header class="site-header">
        <nav class="navbar">
            <a href="/" class="brand-logo">
                <div class="brand-icon">⚡</div>
                <div>
                    <span class="brand-text">NEXUS EXTRACTOR</span>
                </div>
                <span class="brand-badge">PRO V2.0</span>
            </a>

            <div class="nav-links">
                <a href="/" class="nav-item {% if active_page == 'home' %}active{% endif %}">🏠 Extractor</a>
                <a href="/qr" class="nav-item {% if active_page == 'qr' %}active{% endif %}">📷 QR to XML</a>
                <a href="/batch" class="nav-item {% if active_page == 'batch' %}active{% endif %}">📑 Batch</a>
                <a href="https://github.com/Hibandd122/am-share-extractor" target="_blank" rel="noopener noreferrer" class="nav-github-btn">
                    <span>GitHub</span>
                    <span>↗</span>
                </a>
            </div>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Site Footer -->
    <footer class="site-footer">
        <div class="footer-content">
            <div>
                © 2026 <strong>Nexus Alight Extractor</strong> · High-Performance AM Project Pipeline
            </div>
            <div class="footer-links">
                <a href="/" class="footer-link">Home</a>
                <a href="/qr" class="footer-link">QR Scanner</a>
                <a href="/batch" class="footer-link">Batch Tool</a>
                <a href="https://github.com/Hibandd122/am-share-extractor" target="_blank" class="footer-link">Source Code</a>
            </div>
        </div>
    </footer>

    <!-- QR & Main Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="/static/js/qr-scanner.js"></script>
    <script src="/static/js/app.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
